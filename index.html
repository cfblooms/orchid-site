<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蘭花精選展示型錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 antialiased min-h-screen pb-24">

  <!-- 頂部標題區 -->
  <header class="bg-white border-b border-stone-200 sticky top-0 z-30 py-4 px-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-stone-900">蘭花精選盆栽目錄</h1>
        <p class="text-xs text-stone-500 mt-0.5">點擊圖片可放大觀看，記下作品編號即可致電或加 LINE 洽詢訂購</p>
      </div>
      <!-- 快速聯絡按鈕 -->
      <div class="flex gap-2">
        <a href="tel:0958-179-725" class="flex items-center gap-1.5 bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2 rounded-full text-sm font-medium shadow transition">
          <span>📞 電話訂購</span>
        </a>
        <a href="https://lin.ee/SwQOPJk" target="_blank" class="flex items-center gap-1.5 bg-[#06C755] hover:opacity-90 text-white px-4 py-2 rounded-full text-sm font-medium shadow transition">
          <span>💬 LINE 諮詢</span>
        </a>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- 分類篩選按鈕 -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button onclick="filterCategory('全部')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-stone-900 text-white transition">全部展示</button>
      <button onclick="filterCategory('開幕誌慶')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-stone-600 border border-stone-300 hover:bg-stone-100 transition">開幕誌慶 (A)</button>
      <button onclick="filterCategory('升遷榮調')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-stone-600 border border-stone-300 hover:bg-stone-100 transition">升遷榮調 (B)</button>
      <button onclick="filterCategory('居家辦公')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-stone-600 border border-stone-300 hover:bg-stone-100 transition">居家辦公 (C)</button>
      <button onclick="filterCategory('追思弔唁')" class="cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-stone-600 border border-stone-300 hover:bg-stone-100 transition">追思弔唁 (D)</button>
    </div>

    <!-- 水平網格排版 -->
    <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div id="loading" class="text-stone-400 py-12 text-center col-span-full">載入作品中...</div>
    </div>
  </main>

  <!-- 圖片點擊放大彈窗 (Lightbox) -->
  <div id="lightbox" onclick="closeLightbox(event)" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex-col items-center justify-center p-4">
    <!-- 關閉按鈕 -->
    <button onclick="closeLightboxDirect()" class="absolute top-4 right-4 text-white text-3xl font-light hover:text-stone-300 p-2 z-10">&times;</button>
    
    <!-- 圖片主體 -->
    <div class="relative max-w-4xl max-h-[85vh] flex flex-col items-center">
      <img id="lightbox-img" src="" alt="放大預覽" class="max-h-[75vh] w-auto max-w-full object-contain rounded-lg shadow-2xl">
      <!-- 底部編號與聯絡列 -->
      <div id="lightbox-caption" class="mt-4 flex items-center justify-between w-full text-white text-sm px-2">
        <span id="lightbox-code" class="font-bold text-base"></span>
        <div class="flex gap-2">
          <a id="lightbox-line" href="#" target="_blank" class="bg-[#06C755] text-white text-xs px-3 py-1.5 rounded-full font-medium hover:opacity-90 transition">
            💬 LINE 洽詢
          </a>
          <a href="tel:0958-179-725" class="bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-full font-medium hover:bg-emerald-800 transition">
            📞 打電話
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- 手機版右下角浮動撥號鈕 -->
  <div class="fixed bottom-6 right-6 z-40 sm:hidden flex flex-col gap-3">
    <a href="tel:0958-179-725" class="w-14 h-14 bg-emerald-700 text-white rounded-full flex items-center justify-center shadow-lg text-2xl active:scale-95 transition">
      📞
    </a>
  </div>

  <script>
    const CLOUD_NAME = "mridz5af";
    
    const CATEGORY_CONFIG = [
      { name: '開幕誌慶', prefix: 'A' },
      { name: '升遷榮調', prefix: 'B' },
      { name: '居家辦公', prefix: 'C' },
      { name: '追思弔唁', prefix: 'D' }
    ];

    let allOrchids = [];
    let currentFilter = '全部';

    async function loadAllCategories() {
      const container = document.getElementById('gallery');
      allOrchids = [];

      try {
        const requests = CATEGORY_CONFIG.map(cat => 
          fetch(`https://res.cloudinary.com/${CLOUD_NAME}/image/list/${encodeURIComponent(cat.name)}.json`)
            .then(res => res.ok ? res.json() : { resources: [] })
            .then(data => {
              const resources = data.resources || [];
              resources.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
              
              return resources.map((item, idx) => ({
                ...item,
                categoryName: cat.name,
                code: `${cat.prefix}${String(idx + 1).padStart(3, '0')}`
              }));
            })
            .catch(() => [])
        );

        const results = await Promise.all(requests);
        allOrchids = results.flat();
        renderGallery();
      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="text-rose-500 py-12 text-center col-span-full">載入失敗，請確認 Cloudinary Security 的 Resource list 設定</div>';
      }
    }

    function renderGallery() {
      const container = document.getElementById('gallery');
      container.innerHTML = '';

      const filtered = currentFilter === '全部'
        ? allOrchids
        : allOrchids.filter(item => item.categoryName === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-stone-400 py-12 text-center col-span-full">目前此分類尚無照片</div>';
        return;
      }

      filtered.forEach(item => {
        const thumbUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto,w_800/v${item.version}/${item.public_id}.${item.format}`;
        const fullUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/f_auto,q_auto,w_1600/v${item.version}/${item.public_id}.${item.format}`;
        const lineMsg = encodeURIComponent(`您好，我想詢問【${item.categoryName}】編號 ${item.code} 這款蘭花花禮：\n${fullUrl}`);
        const lineLink = `https://lin.ee/SwQOPJk?text=${lineMsg}`;

        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl overflow-hidden shadow-sm border border-stone-200 hover:shadow-md transition duration-300 flex flex-col";
        card.innerHTML = `
          <!-- 點擊圖片觸發放大 -->
          <div onclick="openLightbox('${fullUrl}', '${item.categoryName}', '${item.code}', '${lineLink}')" class="relative bg-stone-100 aspect-square overflow-hidden cursor-zoom-in group">
            <img src="${thumbUrl}" alt="作品 ${item.code}" loading="lazy" class="w-full h-full object-cover block group-hover:scale-105 transition duration-500">
            <span class="absolute top-3 left-3 bg-stone-900/85 backdrop-blur-sm text-white text-xs font-semibold px-2.5 py-1 rounded-md tracking-wider">
              編號 ${item.code}
            </span>
            <div class="absolute inset-0 bg-black/10 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-sm font-medium">
              🔍 點擊看大圖
            </div>
          </div>
          <div class="p-4 flex flex-col justify-between flex-grow">
            <div class="mb-3">
              <span class="text-xs font-medium text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-full inline-block mb-1.5">
                ${item.categoryName}
              </span>
              <h3 class="font-bold text-stone-800 text-base">蘭花精選盆栽 (${item.code})</h3>
            </div>
            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-stone-100">
              <a href="tel:0958-179-725" class="text-center py-2 rounded-lg bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold transition">
                📞 撥打電話
              </a>
              <a href="${lineLink}" target="_blank" class="text-center py-2 rounded-lg bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold transition">
                💬 LINE 訂購
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 燈箱控制函式
    function openLightbox(url, category, code, lineLink) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-code').innerText = `【${category}】作品編號：${code}`;
      document.getElementById('lightbox-line').href = lineLink;
      document.getElementById('lightbox').classList.remove('hidden');
      document.getElementById('lightbox').classList.add('flex');
    }

    function closeLightbox(event) {
      if (event.target.id === 'lightbox') {
        closeLightboxDirect();
      }
    }

    function closeLightboxDirect() {
      document.getElementById('lightbox').classList.add('hidden');
      document.getElementById('lightbox').classList.remove('flex');
    }

    // 按鍵盤 ESC 也可關閉
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightboxDirect();
    });

    function filterCategory(cat) {
      currentFilter = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const isMatch = (cat === '全部' && btn.innerText.includes('全部')) || btn.innerText.includes(cat);
        btn.className = isMatch
          ? "cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-stone-900 text-white transition"
          : "cat-btn px-4 py-1.5 rounded-full text-sm font-medium bg-white text-stone-600 border border-stone-300 hover:bg-stone-100 transition";
      });
      renderGallery();
    }

    loadAllCategories();
  </script>
</body>
</html>
